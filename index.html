<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080a"><title>FUCKIN CLOCK</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><main><header><h1 id="title">World Clock</h1><button id="settings" aria-label="Settings">⚙</button></header><section id="world"><p class="muted">WHAT FUCKIN TIME IS IT?</p><div id="local"></div><button id="addCity">+ Add Location</button><div id="cities"></div></section><section id="alarm" hidden><p class="muted">WAKE THE FUCK UP!</p><button id="addAlarm">+ Add Alarm</button><div id="alarms"></div><p class="muted">Keep this app open and your device awake for alarms.</p></section><section id="stopwatch" hidden><div class="big" id="elapsed">00:00.00</div><p id="precision" class="muted"></p><div class="controls"><button id="lap">Lap</button><button id="swStart" class="green">Start</button></div><div id="laps"></div></section><section id="timer" hidden><p class="muted">THE FUCKIN COUNTDOWN</p><div class="big" id="remaining">00:05:00</div><div id="duration"><label>Hours<input id="hours" type="number" min="0" max="99" value="0"></label><label>Minutes<input id="minutes" type="number" min="0" max="59" value="5"></label><label>Seconds<input id="seconds" type="number" min="0" max="59" value="0"></label></div><div id="presets"><button data-min="1">1 min</button><button data-min="5">5 min</button><button data-min="15">15 min</button></div><div class="controls"><button id="cancelTimer">Cancel</button><button id="timerStart" class="green">Start</button></div></section></main><nav><button data-tab="world" class="active">◎<small>World Clock</small></button><button data-tab="alarm">◷<small>Alarm</small></button><button data-tab="stopwatch">⏱<small>Stopwatch</small></button><button data-tab="timer">⌛<small>Timer</small></button></nav><dialog id="cityDialog"><h2>WHERE THE FUCK?</h2><input id="search" placeholder="Search city or time zone"><div id="matches"></div><button data-close>Done</button></dialog><dialog id="alarmDialog"><h2>Set Alarm</h2><input id="alarmTime" type="time" value="07:00"><input id="alarmLabel" placeholder="GET YOUR ASS UP"><p>Repeat (none = once)</p><div id="days"></div><label>Sound <select id="sound"><option value="beep">Beep</option><option value="chime">Chime</option></select></label><label><input id="snooze" type="checkbox" checked> Snooze (9 minutes)</label><button id="saveAlarm">Save</button><button data-close>Cancel</button></dialog><dialog id="prefs"><h2>Settings</h2><label><input id="format" type="checkbox"> 24-hour time</label><label><input id="ridiculous" type="checkbox"> Ridiculous time</label><label><input id="precise" type="checkbox"> Unnecessary precision</label><button data-close>Done</button></dialog><dialog id="ring"><h2 id="ringTitle">WAKE THE FUCK UP!</h2><button id="snoozeRing">Snooze</button><button id="stopRing">Stop</button></dialog><script src="app.js"></script></body></html>
